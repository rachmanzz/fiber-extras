# v3/queue-rabbitmq integration tests against a live RabbitMQ service.
name: queue-rabbitmq

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "v3/queue-rabbitmq/**"
      - "v3/queue/**"
      - "v3/worker/**"
      - "go.work"
      - "go.work.sum"
      - ".github/workflows/queue-rabbitmq.yml"
  pull_request:
    paths:
      - "v3/queue-rabbitmq/**"
      - "v3/queue/**"
      - "v3/worker/**"
      - "go.work"
      - "go.work.sum"
      - ".github/workflows/queue-rabbitmq.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Integration (RabbitMQ)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      rabbitmq:
        image: rabbitmq:3-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: fiber
          RABBITMQ_DEFAULT_PASS: secretpassword
        ports:
          - "127.0.0.1:5672:5672"
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 15s
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: v3/queue-rabbitmq/go.mod
          cache-dependency-path: v3/**/go.sum

      - name: Vet and format check
        working-directory: v3/queue-rabbitmq
        run: |
          go vet ./...
          test -z "$(gofmt -l .)"

      - name: Test against live RabbitMQ
        working-directory: v3/queue-rabbitmq
        env:
          TEST_RABBITMQ_URL: amqp://fiber:secretpassword@127.0.0.1:5672/
        run: go test -v -count=1 -cover -race ./...
