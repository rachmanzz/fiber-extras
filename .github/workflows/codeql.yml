# CodeQL static analysis for the Go codebase.
#
# Go does not support `build-mode: none`, and a root `go build ./...` fails
# because this is a go.work multi-module workspace, so we use `manual` mode and
# build each module explicitly.
name: codeql

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (go)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [go]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: v3/worker/go.mod
          cache-dependency-path: v3/**/go.sum

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: manual

      - name: Build every module
        run: |
          for d in v3/*/; do
            (cd "$d" && go build ./...)
          done

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
